id: io.github.breadmakesyoufull.bpm2fps
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: bpm2fps
rename-icon: icon
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
    - BASEAPP_DISABLE_NUMPY=1
cleanup-commands:
  - /app/cleanup-BaseApp.sh
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-desktop
modules:
  - name: bpm2fps
    buildsystem: simple
    build-commands:
      - install -D flatpak/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
      - install -D flatpak/icon.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/
      - install -D flatpak/${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications/
      - pip3 install --prefix=/app --no-deps --no-build-isolation .[gui]
    sources:
      - type: git
        url: https://github.com/BreadMakesYouFull/bpm2fps.git
        tag: 1.0.2
        commit: 247c0c8235408e2764231c69d67fdbef625f6ed5
